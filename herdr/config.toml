onboarding = false

[theme]
name = "catppuccin"

[ui]
agent_panel_sort = "spaces"

[ui.sound]
enabled = false

[[keys.command]]
key = "prefix+m"
type = "shell"
command = "herdr pane move \"$HERDR_ACTIVE_PANE_ID\" --new-tab --focus"
description = "Move pane to new tab"

[[keys.command]]
key = "prefix+ctrl+g"
type = "popup"
command = "lazygit"
description = "Open lazygit in a popup"
width = "96%"
height = "96%"

[[keys.command]]
key = "prefix+ctrl+d"
type = "popup"
command = "lazydocker"
description = "Open lazydocker in a popup"
width = "96%"
height = "96%"

[[keys.command]]
key = "prefix+ctrl+y"
type = "popup"
command = "yazi"
description = "Open yazi in a popup"
width = "96%"
height = "96%"
